name: "⚡ Performance issue"
description: Report slow loading, layout shifts, janky interactions or oversized assets.
title: "[Performance]: "
labels: ["performance"]
body:
  - type: input
    id: route
    attributes:
      label: Affected route
      placeholder: "/"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Measurement or evidence
      description: Include Lighthouse report, trace, network waterfall or screen recording if available.
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: User impact
    validations:
      required: true
