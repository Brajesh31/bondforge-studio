name: "🐛 Bug report"
description: Report a reproducible defect in the Social Bond website
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Search existing issues first. Do not include passwords, personal client data, or private security details."
  - type: input
    id: route
    attributes:
      label: Affected route
      placeholder: "/contact"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide exact steps and the starting state.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS and viewport
      placeholder: "Chrome, Windows 11, 1440 × 900"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Logs or screenshots with credentials and personal data removed.
