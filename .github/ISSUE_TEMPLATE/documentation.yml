name: "📚 Documentation improvement"
description: Report unclear, missing, or incorrect project documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: document
    attributes:
      label: Document or path
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
    validations:
      required: false
