name: Update README Timestamp

# Manual only. Automatic push/schedule commits caused README races during normal documentation updates.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-readme-timestamp
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update README timestamp
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          TIMESTAMP_LINE="Last updated: $DATE"
          if [ -f README.md ]; then
            if grep -q "Last updated:" README.md; then
              sed -i "s/Last updated:.*/$TIMESTAMP_LINE/" README.md
            else
              printf "\\n%s\\n" "$TIMESTAMP_LINE" >> README.md
            fi
          else
            echo "README.md is missing; refusing to create a generic replacement."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes detected."
            exit 0
          fi
          git commit -m "chore: update README timestamp"
          git push origin HEAD
