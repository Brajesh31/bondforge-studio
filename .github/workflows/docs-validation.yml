name: Documentation validation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "*.md"
      - "scripts/**"
      - ".github/workflows/docs-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "*.md"
      - "scripts/validate-*.py"
      - ".github/workflows/docs-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate local documentation links
        run: python scripts/validate-doc-links.py
      - name: Validate repository structure
        run: python scripts/validate-project-structure.py
