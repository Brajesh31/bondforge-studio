<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Social Bond frontend architecture</title><desc id="desc">A visitor browser loads a static host, which serves the Vite React application. React Router selects page components. The UI reads bundled static content and assets, stores the theme locally, and may request remote fonts and images. No application API or database is connected.</desc>
<defs><style>.bg{fill:#101827}.panel{fill:#1e293b;stroke:#64748b;stroke-width:2}.accent{fill:#f97360}.text{fill:#f8fafc;font:600 22px Arial,sans-serif}.small{fill:#cbd5e1;font:16px Arial,sans-serif}.line{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#fbbf24;stroke-width:3;stroke-dasharray:9 8;fill:none;marker-end:url(#arrow2)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#94a3b8"/></marker><marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#fbbf24"/></marker></defs>
<rect class="bg" width="1200" height="560" rx="28"/><text x="54" y="58" class="text" font-size="30">SOCIAL BOND · FRONTEND ARCHITECTURE</text>
<rect x="55" y="115" width="205" height="120" rx="16" class="panel"/><text x="157" y="160" text-anchor="middle" class="text">Visitor</text><text x="157" y="192" text-anchor="middle" class="small">Browser</text>
<rect x="345" y="115" width="220" height="120" rx="16" class="panel"/><text x="455" y="160" text-anchor="middle" class="text">Static host</text><text x="455" y="192" text-anchor="middle" class="small">index.html + assets</text>
<rect x="650" y="115" width="230" height="120" rx="16" class="panel"/><text x="765" y="160" text-anchor="middle" class="text">React application</text><text x="765" y="192" text-anchor="middle" class="small">Vite · React 19 · TS</text>
<rect x="965" y="80" width="190" height="100" rx="16" class="panel"/><text x="1060" y="120" text-anchor="middle" class="text">Router</text><text x="1060" y="148" text-anchor="middle" class="small">src/App.tsx</text>
<rect x="965" y="215" width="190" height="100" rx="16" class="panel"/><text x="1060" y="255" text-anchor="middle" class="text">Pages + UI</text><text x="1060" y="283" text-anchor="middle" class="small">src/pages + components</text>
<path d="M260 175H345M565 175H650M880 150H965M1060 180V215" class="line"/>
<rect x="350" y="355" width="220" height="105" rx="16" class="panel"/><text x="460" y="395" text-anchor="middle" class="text">Static content</text><text x="460" y="425" text-anchor="middle" class="small">src/data + local assets</text>
<rect x="650" y="355" width="220" height="105" rx="16" class="panel"/><text x="760" y="395" text-anchor="middle" class="text">Browser storage</text><text x="760" y="425" text-anchor="middle" class="small">Theme preference only</text>
<rect x="950" y="375" width="205" height="105" rx="16" class="panel"/><text x="1052" y="415" text-anchor="middle" class="text">Remote assets</text><text x="1052" y="445" text-anchor="middle" class="small">Fonts / image hosts</text>
<path d="M765 235V295H460V355M765 235V355M880 210H920V425H950" class="line"/>
<text x="55" y="520" class="small">No application API · No database · No authentication · No server-side form processing</text>
</svg>